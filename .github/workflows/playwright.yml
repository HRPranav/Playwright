name: Playwright Tests
on:
  push:
    branches: [ feature1]
  pull_request:
    branches: [ feature1] 
  workflow_dispatch:
    inputs:
      test_spec:
        description: 'Test file, folder, or pattern to run (e.g. tests or tests/mytest.spec.js)'
        required: false
        default: 'tests'
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      env:
        TEST_SPEC: ${{ github.event.inputs.test_spec || 'tests' }}
      run: npx playwright test $TEST_SPEC --project=Chromium
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30