name: Playwright Tests

on:
  push:
    branches: [ feature2 ]
  pull_request:
    branches: [ feature2 ]
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Select Test Suite to Run'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - regression

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Smoke Suite
        if: github.event.inputs.test_suite == 'smoke' || github.event_name == 'pull_request'
        run: npx playwright test tests/Tags.spec.js --grep "@smoke"

      - name: Run Regression Suite
        if: github.event.inputs.test_suite == 'regression' || github.event_name == 'push'
        run: npx playwright test tests/Tags.spec.js --grep "@regression" --project=chromium

      - name: Upload HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
