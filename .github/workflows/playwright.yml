name: Playwright Tests
on:
  push:
    branches: [ feature1]
  pull_request:
    branches: [ feature1] 
  workflow_dispatch:
    inputs:
      test_spec:
        description: 'Select test file, folder, or pattern to run'
        required: false
        default: 'tests'
        options:
          - tests
          - tests/Alerts.spec.js
          - tests/Apitesting.spec.js
          - tests/Assertions.spec.js
          - tests/Autosuggestdropdown.spec.js
          - tests/Bootstrapdropdown.spec.js
          - tests/Buildinfixtures.spec.js
          - tests/Byodaddresspage.spec.js
          - tests/Byodcartscreen.spec.js
          - tests/BYODhomepage.spec.js
          - tests/Byoditemlisting.spec.js
          - tests/BYODitemlistingcoupon.spec.js
          - tests/BYODLogin.spec.js
          - tests/checkbox.spec.js
          - tests/customfixture.spec.js
          - tests/Datepicker.spec.js
          - tests/Draganddrop.spec.js
          - tests/Dropdown.spec.js
          - tests/example.spec.js
          - tests/Inputbox.spec.js
          - tests/keyboardactions.spec.js
          - tests/Mockapi.spec.js
          - tests/Mousehover.spec.js
          - tests/Multiplepages.spec.js
          - tests/Multiselectdropdown.spec.js
          - tests/Pom.spec.js
          - tests/Radiobutton.spec.js
          - tests/Reporter.spec.js
          - tests/screenshots/
          - tests/screenshots.spec.js
          - tests/softassertion.spec.js
          - tests/Tags.spec.js
          - tests/test-1.spec.ts
          - tests/test-2.spec.ts
          - tests/test-3.spec.ts
          - tests/test-4.spec.ts
          - tests/Testdatafolder/
          - tests/Uploadfile.spec.js
          - tests/Uploadfiles/
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      env:
        TEST_SPEC: ${{ github.event.inputs.test_spec || 'tests' }}
      run: npx playwright test $TEST_SPEC --project=Chromium
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30